name: secret-scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: full-history-and-worktree
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify scanner recurrence fixture
        run: sh scripts/secret-scan.sh verify-fixture
      - name: Scan worktree, reachable history, and present artifact roots
        run: sh scripts/secret-scan.sh scan
