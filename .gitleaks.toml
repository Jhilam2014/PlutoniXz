title = "PlutoMix secret scanning"

# Keep the maintained detector's default rules. This additive rule exists only
# to prove the local/CI control fails closed on an unmistakably fake fixture.
[extend]
useDefault = true

[[rules]]
id = "plutomix-fake-secret"
description = "PlutoMix fake-secret regression fixture"
regex = '''plutomix_fake_secret_[A-Za-z0-9]{24}'''
secretGroup = 0
entropy = 0
keywords = ["plutomix_fake_secret"]
