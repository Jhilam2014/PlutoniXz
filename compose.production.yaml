services:
  frontend:
    ports: !override
      - "127.0.0.1:5173:5173"
    environment:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ".plutomix.in"
    restart: unless-stopped

  backend:
    ports: !override
      - "127.0.0.1:8080:8080"

    environment:
      DECISION_CONTINUITY_DURABLE_WORKFLOWS: "true"
      DECISION_CONTINUITY_DATABASE_URL: "${DECISION_CONTINUITY_DATABASE_URL:?Missing DECISION_CONTINUITY_DATABASE_URL}"
      GOTHAM_STUDIO_REPOSITORY: "postgres"
      PLUTOMIX_RUNTIME_ROOT: /workspace/runtime
      PROJECT_PREVIEW_URL_TEMPLATE: "${PROJECT_PREVIEW_URL_TEMPLATE:-https://p{port}.preview.plutomix.in}"
      PROJECT_PREVIEW_ALLOWED_HOST: "${PROJECT_PREVIEW_ALLOWED_HOST:-.preview.plutomix.in}"
      # Managed Vite ports are reachable only through the host Nginx proxy.
      PROJECT_RUNTIME_HOST_IP: "127.0.0.1"
      # Generated projects live outside the read-only source tree in production.
      # Keep the compatibility ignore registry in runtime as well; the base
      # /workspace/.gitignore bind may resolve to a directory on a fresh host.
      PROJECTS_GITIGNORE_PATH: /workspace/runtime/projects.gitignore
      WORKFLOW_PUBLICATION_ROOT: /workspace/runtime
      GOTHAM_PUBLICATION_OUTBOX_PATH: /workspace/runtime/workflow-publication-outbox
      AGENT_MEMORY_SYNC_STATE_ROOT: /workspace/runtime/agent-memory
      HOSTING_OBSERVABILITY_DIR: /workspace/runtime/observability/hosting
      # Project and agent projections are live runtime state. Keep production
      # writes in the persisted, gitignored runtime mount instead of modifying
      # tracked source files and blocking the next deployment.
      PROJECT_AGENT_MARKDOWN_ROOT: /workspace/runtime/agents/generated
      PROJECT_AGENT_ARCHIVE_ROOT: /workspace/runtime/agents/archived/legacy-project-scoped
      PROJECT_AGENT_REUSE_DECISION_ROOT: /workspace/runtime/registry/agent-reuse-decisions
      PROJECT_AGENT_REGISTRY_ROOT: /workspace/runtime/registry/agents
      PROJECT_AGENT_NEO4J_PATH: /workspace/runtime/graph/neo4j/generated-project-agents.cypher
      AGENTIC_SYSTEM_GRAPH_PATH: /workspace/runtime/topology/d3/agentic-system-graph.json
      FRONTEND_AGENTIC_SYSTEM_GRAPH_PATH: /workspace/runtime/frontend/topology/d3/agentic-system-graph.json

    volumes:
      - type: bind
        source: .
        target: /workspace/project
        read_only: true
      - type: bind
        source: ./runtime
        target: /workspace/project/runtime
      - type: bind
        source: ./.runtime-secrets/vultr-postgres-ca.crt
        target: /workspace/project/.runtime-secrets/vultr-postgres-ca.crt
        read_only: true
        bind:
          # A missing short-syntax bind source is silently created as a
          # directory, which later makes node-postgres fail with EISDIR while
          # opening the CA certificate. Fail during container creation instead.
          create_host_path: false

    restart: unless-stopped

  generated-site:
    ports: !override
      - "127.0.0.1:5174:5174"
    environment:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: "preview.plutomix.in"
    restart: unless-stopped
