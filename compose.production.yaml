services:
  frontend:
    ports: !override
      - "127.0.0.1:5173:5173"
    environment:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ".plutomix.in"
    restart: unless-stopped

  backend:
    ports: !override
      - "127.0.0.1:8080:8080"

    environment:
      DECISION_CONTINUITY_DURABLE_WORKFLOWS: "true"
      DECISION_CONTINUITY_DATABASE_URL: "${DECISION_CONTINUITY_DATABASE_URL:?Missing DECISION_CONTINUITY_DATABASE_URL}"
      GOTHAM_STUDIO_REPOSITORY: "postgres"

    volumes:
      - type: bind
        source: ./.runtime-secrets/vultr-postgres-ca.crt
        target: /workspace/project/.runtime-secrets/vultr-postgres-ca.crt
        read_only: true
        bind:
          # A missing short-syntax bind source is silently created as a
          # directory, which later makes node-postgres fail with EISDIR while
          # opening the CA certificate. Fail during container creation instead.
          create_host_path: false

    restart: unless-stopped

  generated-site:
    ports: !override
      - "127.0.0.1:5174:5174"
    environment:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: "preview.plutomix.in"
    restart: unless-stopped
