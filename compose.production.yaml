services:
  frontend:
    ports: !override
      - "127.0.0.1:5173:5173"
    environment:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ".plutomix.in"
    restart: unless-stopped

  backend:
    ports: !override
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  generated-site:
    ports: !override
      - "127.0.0.1:5174:5174"
    environment:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: "preview.plutomix.in"
    restart: unless-stopped